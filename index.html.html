        if(!confirm(msg)) return;
        if(el.getAttribute('data-fk') === 'game') fixtures.games = fixtures.games.filter(function(x){ return x.id !== id; });
        else fixtures.events = fixtures.events.filter(function(x){ return x.id !== id; });
        Object.keys(hosp).forEach(function(sp){ if(hosp[sp] && hosp[sp].rows) delete hosp[sp].rows[id]; });
        saveFixtures(); saveHosp(); render();
      };
    });
  }

  function renderHosp(sponsor){
    var host = document.getElementById('content');
    var hs = hospFor(sponsor);
    var types = hs.types || [];
    var rowsMap = hs.rows || {};
    var myGames = sortFixtures(fixtures.games).filter(function(g){ return rowsMap[g.id]; });
    var myEvents = sortFixtures(fixtures.events).filter(function(e){ return rowsMap[e.id]; });
    var freeGames = sortFixtures(fixtures.games).filter(function(g){ return !rowsMap[g.id]; });
    var freeEvents = sortFixtures(fixtures.events).filter(function(e){ return !rowsMap[e.id]; });

    var typeRows = types.map(function(t){
      var used = allocatedFor(sponsor, t.id);
      var capped = hasCap(t);
      var total = capped ? (+t.total || 0) : 0;
      var rem = capped ? total - used : 0;
      var pct = total ? Math.min(100, Math.round(used / total * 100)) : 0;
      return '<div class="hosp-type">' +
        '<input data-tname="' + t.id + '" value="' + escAttr(t.name) + '">' +
        '<input type="number" min="0" data-ttotal="' + t.id + '" value="' + escAttr(capped ? t.total : '') + '" placeholder="No limit">' +
        (capped
          ? '<div><div class="hosp-rem ' + (rem < 0 ? 'neg' : '') + '">' + used + ' allocated, ' + rem + ' remaining' + (rem < 0 ? ' (over allocated)' : '') + '</div>' +

  function renderSponsorTab(sponsor){
    if(sponsorView === 'wip' && catOf(sponsor) === 'sponsor'){ renderWip(sponsor); return; }
    if(sponsorView === 'hosp' && catOf(sponsor) === 'sponsor'){ renderHosp(sponsor); return; }
    var host = document.getElementById('content');
    var list = tasksFor(sponsor).slice().sort(function(a,b){
      if(a.status === 'done' && b.status !== 'done') return 1;
      if(b.status === 'done' && a.status !== 'done') return -1;
      if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1; if(WHEN_ORDER[a.when] !== WHEN_ORDER[b.when]) return WHEN_ORDER[a.when] - WHEN_ORDER[b.when]; var dc = dueCmp(a, b); if(dc) return dc;
      var order = { high:0, medium:1, low:2 };
      return order[a.priority] - order[b.priority];
    });

    var rows = list.length === 0
      ? '<p class="empty-list">No tasks for ' + escapeHtml(sponsor) + ' yet.</p>'
      : list.map(function(t, idx){ return taskRowHtml(t, idx, false); }).join('');

    host.innerHTML = sponsorToggleHtml(sponsor) +
      '<div class="add-panel">' +

          '<select id="taskStatus"><option value="todo">To do</option><option value="progress">In progress</option><option value="waiting">Waiting</option></select>' +
          '<button id="addBtn">Add task</button>' +
        '</div>' +
        dueChipsHtml('#taskDue') +

      '</div>' +

          '<button class="ghost-btn done-btn" id="bulkBtn" style="display:none;">Mark done</button>' +
        '</div>' +
        '<div class="toolbar-right"><div class="copy-wrap"><span class="toast" id="copyToast">Copied!</span><button class="ghost-btn" id="copyBtn">Copy as update</button></div></div>' +
      '</div>' +
      '<div class="task-list">' + rows + '</div>';

    document.getElementById('addBtn').onclick = function(){

      var text = textEl.value.trim();
      var err = document.getElementById('fieldErr');
      if(!text){ err.style.display = 'block'; return; }
      err.style.display = 'none';
      var taskDueVal = document.getElementById('taskDue').value;
      tasks.push({
        id: uid(), text: text, sponsor: sponsor,
        due: taskDueVal, when: taskDueVal ? whenFromDue(taskDueVal) : 'later', priority: document.getElementById('taskPriority').value,
        status: document.getElementById('taskStatus').value, notes: '', links: []
      });
      setStatus(tasks[tasks.length-1], document.getElementById('taskStatus').value);
      saveTasks(); render();
    };
    document.getElementById('taskText').addEventListener('keydown', function(e){
      if(e.key === 'Enter') document.getElementById('addBtn').click();
    });

    document.getElementById('selectAll').onchange = function(e){
      if(e.target.checked){ list.forEach(function(t){ selectedIds.add(t.id); }); }
      else { list.forEach(function(t){ selectedIds.delete(t.id); }); }
      render();
    };
    document.getElementById('bulkBtn').onclick = function(){
      tasks.forEach(function(t){ if(selectedIds.has(t.id)) setStatus(t, 'done'); });
      selectedIds.clear();
      saveTasks(); render();
    };
    document.getElementById('copyBtn').onclick = function(){
      var text = buildSummary(sponsor);
      var toast = document.getElementById('copyToast');
      function flash(){ toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 1500); }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(flash).catch(function(){ window.prompt('Copy this update:', text); });
      } else {
        window.prompt('Copy this update:', text);
      }
    };

    attachSponsorToggle(host);
    attachRowHandlers(host);
    renderToolbar();
  }



  function savePartnerInfo(){
    DOC_REF.set({ partnerInfo: JSON.stringify(partnerInfo) }, { merge: true }).catch(function(err){
      setSyncStatus('Save failed, check your connection', true);
    });
  }
  function infoFor(sp){
    var pi = partnerInfo[sp] || {};
    return { start: pi.start || '', end: pi.end || '', notes: pi.notes || '', contacts: pi.contacts || [] };
  }
  function infoEnsure(sp){
    if(!partnerInfo[sp]) partnerInfo[sp] = { start: '', end: '', notes: '', contacts: [] };
    if(!partnerInfo[sp].contacts) partnerInfo[sp].contacts = [];
    return partnerInfo[sp];
  }
  function contactsText(sp){
    var c = infoFor(sp).contacts;
    if(c.length) return c.map(function(x){ return x.name; }).filter(Boolean).join(', ');
    return (wip[sp] && wip[sp].info && wip[sp].info.contacts) || '';
  }
  function flashSelector(sel){
    setTimeout(function(){
      var el = document.querySelector(sel);
      if(!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 2500);
    }, 60);
  }

  function contractSummary(sp){
    var pi = infoFor(sp);
    if(!pi.end) return { text: '', cls: '' };
    var dd = dayDiff(pi.end);
    var text = dd < 0 ? 'Contract ended ' + prettyDate(pi.end) : 'Contract ends ' + prettyDate(pi.end) + ' (in ' + dd + (dd === 1 ? ' day)' : ' days)');
    return { text: text, cls: dd < 90 ? 'urgent' : (dd < 180 ? 'soon' : '') };
  }

  // ---------- search across everything ----------
  function searchTokens(q){ return q.toLowerCase().split(/\s+/).filter(Boolean); }
  function hayOf(parts){ return parts.filter(function(x){ return x !== undefined && x !== null && x !== ''; }).join(' \n ').toLowerCase(); }
  function hasAll(tk, h){ return tk.every(function(t){ return h.indexOf(t) !== -1; }); }
  function highlight(text, tk){
    var out = '', i = 0;
    var low = text.toLowerCase();
    while(i < text.length){
      var best = -1, bestLen = 0;
      tk.forEach(function(t){
        var at = low.indexOf(t, i);
        if(at !== -1 && (best === -1 || at < best)){ best = at; bestLen = t.length; }
      });
      if(best === -1){ out += escapeHtml(text.slice(i)); break; }
      out += escapeHtml(text.slice(i, best)) + '<mark>' + escapeHtml(text.slice(best, best + bestLen)) + '</mark>';
      i = best + bestLen;
    }
    return out;
  }
  function snippetHtml(text, tk){
    text = String(text || '').replace(/\s+/g, ' ').trim();
    if(!text) return '';
    var low = text.toLowerCase(), idx = -1;
    tk.forEach(function(t){ var at = low.indexOf(t); if(at !== -1 && (idx === -1 || at < idx)) idx = at; });
    if(idx === -1) return escapeHtml(text.slice(0, 110)) + (text.length > 110 ? '...' : '');
    var start = Math.max(0, idx - 40), end = Math.min(text.length, idx + 100);
    return (start > 0 ? '...' : '') + highlight(text.slice(start, end), tk) + (end < text.length ? '...' : '');
  }
  function bestSnippet(fields, tk){
    for(var i = 0; i < fields.length; i++){
      var f = String(fields[i] || '').toLowerCase();
      if(f && tk.some(function(t){ return f.indexOf(t) !== -1; })) return snippetHtml(fields[i], tk);
    }
    return snippetHtml(fields[0] || '', tk);
  }

  function goToResult(type, id, sp){
    selectedIds.clear();
    document.getElementById('globalSearch').value = '';
    searchQuery = '';
    document.getElementById('newSponsorRow').style.display = 'none';
    var flash = '';
    if(type === 'note'){
      activeTab = '__notes__'; noteFilter = 'all'; expandedMeetings.add(id);
      flash = '.note-card[data-note="' + id + '"]';
    } else if(type === 'deliv'){
      activeTab = sp; sponsorView = 'wip'; wipFilter = 'all';
      var it = wipItemsFor(sp).filter(function(x){ return x.id === id; })[0];
      if(it) wipCatOpen[sp + '|' + (it.category || 'General')] = true;
      flash = '.wip-row[data-wid="' + id + '"]';
    } else if(type === 'hosp'){
      activeTab = sp; sponsorView = 'hosp';
      flash = '[data-hrow="' + id + '"]';
    } else if(type === 'fixture'){
      activeTab = '__fixtures__';
      flash = '[data-fxrow="' + id + '"]';
    } else if(type === 'info'){
      activeTab = sp; sponsorView = 'tasks'; infoOpen.add(sp);
      flash = '.pinfo';
    } else {
      activeTab = sp; sponsorView = 'tasks';
    }
    render();
    if(flash) flashSelector(flash);
  }

  function renderSearchResults(){
    var host = document.getElementById('content');
    var tk = searchTokens(searchQuery);
    var sections = [];
    function addSection(title, items){ if(items.length) sections.push({ title: title, items: items }); }
    function item(type, id, sp, tag, title, snip){
      return '<div class="sr-item" data-sr="' + type + '" data-srid="' + escAttr(id) + '" data-srsp="' + escAttr(sp || '') + '">' +
        '<span class="sr-type">' + escapeHtml(tag) + '</span><div><div class="sr-title">' + title + '</div>' +
        (snip ? '<div class="sr-snip">' + snip + '</div>' : '') + '</div></div>';
    }

    var matches = tasks.filter(function(t){ return hasAll(tk, hayOf([t.text, t.sponsor, t.notes])); }).sort(function(a,b){
      if(a.status === 'done' && b.status !== 'done') return 1;
      if(b.status === 'done' && a.status !== 'done') return -1;
      if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1; if(WHEN_ORDER[a.when] !== WHEN_ORDER[b.when]) return WHEN_ORDER[a.when] - WHEN_ORDER[b.when]; var dc = dueCmp(a, b); if(dc) return dc;
      return 0;
    });

    var noteItems = meetings.filter(function(m){ return hasAll(tk, hayOf([m.title, m.body, m.sponsor, prettyDate(m.date)])); })
      .sort(function(a,b){ return a.date < b.date ? 1 : -1; })
      .map(function(m){
        return item('note', m.id, m.sponsor, 'Meeting note', highlight((m.title || 'Untitled meeting') + '', tk) + ' <span style="font-weight:400;color:var(--ink-soft);">' + escapeHtml(prettyDate(m.date) + (m.sponsor ? ', ' + m.sponsor : '')) + '</span>', bestSnippet([m.body, m.title], tk));
      });

    var delivItems = [];
    Object.keys(wip).forEach(function(sp){
      wipItemsFor(sp).forEach(function(it){
        if(!hasAll(tk, hayOf([it.name, it.category, it.qty, it.resp, it.actions, it.comments, it.progress]))) return;
        delivItems.push(item('deliv', it.id, sp, 'Deliverable', highlight(it.name || '', tk) + ' <span style="font-weight:400;color:var(--ink-soft);">' + escapeHtml(sp + ', ' + (it.category || 'General') + ', ' + it.progress) + '</span>', bestSnippet([it.actions, it.comments, it.qty], tk)));
      });
    });

    var infoItems = [];
    Object.keys(partnerInfo).concat(Object.keys(wip)).filter(function(v, i, a){ return a.indexOf(v) === i; }).forEach(function(sp){
      var pi = infoFor(sp), w = (wip[sp] && wip[sp].info) || {};
      var cText = pi.contacts.map(function(c){ return [c.name, c.role, c.email, c.phone].join(' '); }).join(' | ');
      if(!hasAll(tk, hayOf([pi.notes, cText, w.designation, w.objectives, w.contacts]))) return;
      infoItems.push(item('info', sp, sp, 'Partner info', escapeHtml(sp), bestSnippet([pi.notes, cText, w.contacts, w.designation, w.objectives], tk)));
    });

    var hospItems = [];
    Object.keys(hosp).forEach(function(sp){
      var h = hosp[sp] || {};
      var rows = h.rows || {};
      Object.keys(rows).forEach(function(fid){
        var fx = fixtures.games.concat(fixtures.events).filter(function(x){ return x.id === fid; })[0];
        if(!fx) return;
        var label = fx.opponent !== undefined ? gameLabel(fx) : fx.name;
        if(!hasAll(tk, hayOf([label, fx.venue, rows[fid].notes]))) return;
        hospItems.push(item('hosp', fid, sp, 'Hospitality', highlight(label, tk) + ' <span style="font-weight:400;color:var(--ink-soft);">' + escapeHtml(sp) + '</span>', bestSnippet([rows[fid].notes, fx.venue], tk)));
      });
    });

    var fxItems = [];
    sortFixtures(fixtures.games).forEach(function(g){
      if(!hasAll(tk, hayOf([g.round, g.opponent, g.venue, fmtDateTime(g.date, g.time), prettyDate(g.date)]))) return;
      fxItems.push(item('fixture', g.id, '', 'Game', highlight(gameLabel(g), tk), snippetHtml([g.venue, fmtDateTime(g.date, g.time)].filter(Boolean).join(', '), tk)));
    });
    sortFixtures(fixtures.events).forEach(function(e){
      if(!hasAll(tk, hayOf([e.name, e.venue, fmtDateTime(e.date, e.time), prettyDate(e.date)]))) return;
      fxItems.push(item('fixture', e.id, '', 'Event', highlight(e.name || '', tk), snippetHtml([e.venue, fmtDateTime(e.date, e.time)].filter(Boolean).join(', '), tk)));
    });

    var partnerItems = sponsors.filter(function(n){ return hasAll(tk, n.toLowerCase()); }).map(function(n){
      return item('partner', n, n, catOf(n) === 'project' ? 'Project' : 'Partner', highlight(n, tk), '');
    });

    addSection('Meeting notes', noteItems);
    addSection('Deliverables', delivItems);
    addSection('Partner info', infoItems);
    addSection('Hospitality', hospItems);
    addSection('Fixtures', fxItems);
    addSection('Partners and projects', partnerItems);

    var html = '<h2 class="section-title" style="color:var(--myrtle);">Search results for "' + escapeHtml(searchQuery) + '"</h2>';
    if(matches.length){
      html += '<div class="sr-section"><h3 class="fx-h">Tasks (' + matches.length + ')</h3><div class="task-list">' +
        matches.map(function(t, idx){ return taskRowHtml(t, idx, true); }).join('') + '</div></div>';
    }
    sections.forEach(function(sec){
      var shown = sec.items.slice(0, 25).join('');
      html += '<div class="sr-section"><h3 class="fx-h">' + sec.title + ' (' + sec.items.length + ')</h3>' + shown +
        (sec.items.length > 25 ? '<p class="sr-more">and ' + (sec.items.length - 25) + ' more. Try a more specific search.</p>' : '') + '</div>';
    });
    if(!matches.length && !sections.length){
      html += '<p class="empty-list">Nothing found. Try a different word, or part of a name.</p>';
    }
    host.innerHTML = html;
    attachRowHandlers(host);
    host.querySelectorAll('[data-sr]').forEach(function(el){
      el.onclick = function(){ goToResult(el.getAttribute('data-sr'), el.getAttribute('data-srid'), el.getAttribute('data-srsp')); };
    });
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function prettyDate(ds){
    var p = (ds || '').split('-');
    if(p.length !== 3) return ds || '';
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
  }

  var STATUS_LABEL = { todo:'To do', progress:'In progress', waiting:'Waiting', done:'Done' };

  function nextStepsHtml(m){
    var made = tasks.filter(function(t){ return t.fromNote === m.id; });
    var items = made.map(function(t){
      return '<div class="ns-item ' + (t.status==='done' ? 'done' : '') + '">' +
        '<span class="prio-dot ' + t.priority + '"></span>' +
        '<span class="ns-text">' + escapeHtml(t.text) + '</span>' +
        '<span class="task-sponsor-tag">' + escapeHtml(t.sponsor) + '</span>' +
        '<span class="ns-status">' + escapeHtml(STATUS_LABEL[t.status] || '') + '</span>' +
      '</div>';
    }).join('');
    var sponsorSel = '<select data-nssponsor="' + m.id + '">' +
      (m.sponsor ? '' : '<option value="">Sponsor...</option>') +
      sponsors.map(function(sp){ return '<option value="' + escapeHtml(sp) + '"' + (sp===m.sponsor?' selected':'') + '>' + escapeHtml(sp) + '</option>'; }).join('') +
    '</select>';
    return '<div class="ns-section">' +
      '<h4>Next steps from this meeting</h4>' +
      (items || '<p class="no-links-note">No tasks added from this note yet.</p>') +
      '<div class="ns-form">' +
        '<input type="text" data-nstext="' + m.id + '" placeholder="Add a next step...">' +
        sponsorSel +
        '<input type="date" data-nsdue="' + m.id + '" title="Due date (optional)">' +
        dueChipsHtml('[data-nsdue="' + m.id + '"]') +
        '<select data-nsprio="' + m.id + '"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>' +
        '<button data-nsadd="' + m.id + '">Add task</button>' +
      '</div>' +
    '</div>';
  }

  function renderNotes(){
    var host = document.getElementById('content');
    var list = meetings.filter(function(m){
      if(noteFilter === 'all') return true;
      if(noteFilter === '__general__') return !m.sponsor;
      return m.sponsor === noteFilter;
    }).sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });

    var cards = list.length === 0
      ? '<p class="empty-list">No meeting notes yet.</p>'
      : list.map(function(m){
          var open = expandedMeetings.has(m.id);
          return '<div class="note-card" data-note="' + m.id + '">' +
            '<div class="note-head" data-toggle="' + m.id + '">' +
              '<span>' + (open ? '&#9662;' : '&#9656;') + '</span>' +
              '<span class="note-date">' + escapeHtml(prettyDate(m.date)) + '</span>' +
              '<span class="note-title">' + escapeHtml(m.title || 'Untitled meeting') + '</span>' +
              (m.sponsor ? '<span class="task-sponsor-tag">' + escapeHtml(m.sponsor) + '</span>' : '') +
            '</div>' +
            '<div class="note-body ' + (open ? 'open' : '') + '">' +
              '<textarea data-notebody="' + m.id + '">' + escapeHtml(m.body || '') + '</textarea>' +
              nextStepsHtml(m) +
              '<div class="note-actions"><button class="ghost-btn" data-notedel="' + m.id + '">Delete note</button></div>' +
            '</div>' +
          '</div>';
        }).join('');

    var filterOpts = '<option value="all"' + (noteFilter==='all'?' selected':'') + '>All notes</option>' +
      '<option value="__general__"' + (noteFilter==='__general__'?' selected':'') + '>General</option>' +
      sponsors.map(function(sp){ return '<option value="' + escapeHtml(sp) + '"' + (noteFilter===sp?' selected':'') + '>' + escapeHtml(sp) + '</option>'; }).join('');

    host.innerHTML =
      '<div class="add-panel"><div class="note-form">' +
        '<div class="note-form-row">' +
          '<input type="text" id="noteTitle" placeholder="Meeting title, e.g. Quarterly catch up">' +
          '<select id="noteSponsor"><option value="">General</option>' + sponsorOptionsHtml() + '</select>' +
          '<input type="date" id="noteDate" value="' + todayStr() + '">' +
        '</div>' +
        '<textarea id="noteBody" placeholder="Type your meeting notes here..."></textarea>' +
        '<div><button id="noteSaveBtn" class="ghost-btn">Save note</button></div>' +
      '</div></div>' +
      '<div class="note-filter">Show <select id="noteFilter">' + filterOpts + '</select></div>' +
      cards;

    document.getElementById('noteSaveBtn').onclick = function(){
      var body = document.getElementById('noteBody').value.trim();
      var title = document.getElementById('noteTitle').value.trim();
      if(!body && !title) return;
      var m = {
        id: uid(), title: title, body: body,
        sponsor: document.getElementById('noteSponsor').value,
        date: document.getElementById('noteDate').value || todayStr(),
        ts: Date.now()
      };
      meetings.push(m);
      expandedMeetings.add(m.id);
      saveMeetings(); render();
    };
    document.getElementById('noteFilter').onchange = function(){ noteFilter = this.value; render(); };
    host.querySelectorAll('[data-toggle]').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-toggle');
        if(expandedMeetings.has(id)) expandedMeetings.delete(id); else expandedMeetings.add(id);
        render();
      };
    });
    host.querySelectorAll('[data-notebody]').forEach(function(el){
      el.onblur = function(){
        var id = el.getAttribute('data-notebody');
        var m = meetings.find(function(x){ return x.id === id; });
        if(m && m.body !== el.value){ m.body = el.value; saveMeetings(); }
      };
    });
    function addNextStep(id){
      var m = meetings.find(function(x){ return x.id === id; });
      if(!m) return;
      var textEl = host.querySelector('[data-nstext="' + id + '"]');
      var spEl = host.querySelector('[data-nssponsor="' + id + '"]');
      var text = textEl.value.trim();
      if(!text){ textEl.focus(); return; }
      if(!spEl.value){ spEl.focus(); return; }
      var nsDueVal = host.querySelector('[data-nsdue="' + id + '"]').value;
      tasks.push({
        id: uid(), text: text, sponsor: spEl.value,
        due: nsDueVal, when: nsDueVal ? whenFromDue(nsDueVal) : 'later',
        priority: host.querySelector('[data-nsprio="' + id + '"]').value,
        status: 'todo', notes: '', links: [], fromNote: id
      });
      saveTasks(); render();
      setTimeout(function(){
        var again = document.querySelector('[data-nstext="' + id + '"]');
        if(again) again.focus();
      }, 30);
    }
    attachDueChips(host);
    host.querySelectorAll('[data-nsadd]').forEach(function(el){
      el.onclick = function(){ addNextStep(el.getAttribute('data-nsadd')); };
    });
    host.querySelectorAll('[data-nstext]').forEach(function(el){
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); addNextStep(el.getAttribute('data-nstext')); }
      });
    });
    host.querySelectorAll('[data-notedel]').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-notedel');
        if(!confirm('Delete this meeting note?')) return;
        meetings = meetings.filter(function(x){ return x.id !== id; });
        expandedMeetings.delete(id);
        saveMeetings(); render();
      };
    });
  }

  function render(){
    tasks.forEach(syncWhen);
    renderTabs();
    if(searchQuery.trim() !== ''){
      renderSearchResults();
      return;
    }
    if(activeTab === '__notes__'){
      renderNotes();
      return;
    }
    if(activeTab === '__fixtures__'){
      renderFixtures();
      return;
    }
    if(activeTab === '__cat_sponsor__' || activeTab === '__cat_project__'){
      renderCategoryPage(activeTab === '__cat_sponsor__' ? 'sponsor' : 'project');
      return;
    }
    if(activeTab === 'dashboard' || sponsors.indexOf(activeTab) === -1){
      activeTab = 'dashboard';
      renderDashboard();
    } else {
      renderSponsorTab(activeTab);
    }
  }

  document.getElementById('newSponsorSave').onclick = function(){
    var input = document.getElementById('newSponsorInput');
    var name = input.value.trim();
    if(!name) return;
    var chosenCat = document.getElementById('newSponsorCat').value === 'project' ? 'project' : 'sponsor';
    if(sponsors.indexOf(name) === -1){
      sponsors.push(name);
      saveSponsors();
    }
    tabCats[name] = chosenCat;
    saveTabCats();
    sponsorView = 'tasks';
    activeTab = name;
    input.value = '';
    document.getElementById('newSponsorRow').style.display = 'none';
    render();
  };
  document.getElementById('newSponsorCancel').onclick = function(){
    document.getElementById('newSponsorRow').style.display = 'none';
  };
  document.getElementById('newSponsorInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('newSponsorSave').click();
  });

  var searchTimer = null;
  document.getElementById('globalSearch').addEventListener('input', function(e){
    clearTimeout(searchTimer);
    var val = e.target.value;
    searchTimer = setTimeout(function(){ searchQuery = val; selectedIds.clear(); render(); }, 150);
  });

  initLock();
})();
</script>
</body>
</html>
