<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnerships Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#F6F2E9; --surface:#FFFFFF; --ink:#182420; --ink-soft:#5B655F;
    --myrtle:#00573C; --myrtle-dark:#00402C; --myrtle-tint:#E3EFE9;
    --cardinal:#C6102F; --cardinal-tint:#FBE6E7;
    --gold:#B4901A; --gold-tint:#F7EFD8;
    --tan:#D9D2C0; --line:#E4DECD; --done:#9A9385;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; padding:32px 20px 80px; }
  .wrap{max-width:880px;margin:0 auto;}

  .masthead{ border-bottom:3px solid var(--myrtle); padding-bottom:14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .eyebrow{ font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--myrtle); font-weight:500; margin:0 0 4px; }
  h1{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; margin:0; letter-spacing:0.5px; }
  .search-box{ display:flex; align-items:center; }
  .search-box input{
    font-family:'Inter',sans-serif; font-size:13px; padding:8px 12px; width:220px;
    border:1px solid var(--tan); border-radius:16px; background:#fff;
  }

  .rollover-note{
    font-size:12px; color:var(--myrtle-dark); background:var(--myrtle-tint);
    border-radius:4px; padding:8px 12px; margin-bottom:16px; display:none;
  }

  .tabbar{ display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .tab{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.3px; white-space:nowrap;
    padding:9px 14px; color:var(--ink-soft); background:none; border:none; border-bottom:3px solid transparent;
    cursor:pointer; flex-shrink:0;
  }
  .tab.active{ color:var(--myrtle-dark); border-bottom-color:var(--myrtle); font-weight:600; }
  .tab.addtab{ color:var(--gold); font-size:16px; padding:9px 12px; }
  .tab.dragging{ opacity:0.4; }
  .tab.drag-over{ border-bottom-color:var(--gold); }

  .new-sponsor-row{
    display:flex; gap:8px; align-items:center; margin-bottom:20px;
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px;
  }
  .new-sponsor-row input{ flex:1; font-family:'Inter',sans-serif; font-size:13px; padding:8px 9px; border:1px solid var(--tan); border-radius:4px; }
  .new-sponsor-row button, .new-sponsor-row .cancel{ font-family:'Oswald',sans-serif; font-size:12px; border-radius:4px; padding:8px 14px; cursor:pointer; }
  .new-sponsor-row button{ background:var(--myrtle); color:#fff; border:none; }
  .new-sponsor-row .cancel{ background:none; border:1px solid var(--line); color:var(--ink-soft); }

  .add-panel{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:24px; }
  .add-row{ display:grid; grid-template-columns:1.6fr 1fr 0.8fr 0.9fr 1fr auto; gap:8px; }
  .add-row.no-sponsor{ grid-template-columns:1.8fr 0.9fr 1fr 1fr auto; }
  @media (max-width:700px){ .add-row, .add-row.no-sponsor{grid-template-columns:1fr 1fr;} }
  .add-row input, .add-row select{
    font-family:'Inter',sans-serif; font-size:13px; padding:8px 9px; border:1px solid var(--tan); border-radius:4px; background:#fff; color:var(--ink); width:100%;
  }
  .add-row button{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.5px; background:var(--myrtle); color:#fff; border:none;
    border-radius:4px; padding:8px 16px; cursor:pointer; white-space:nowrap;
  }
  .add-row button:hover{background:var(--myrtle-dark);}
  .field-err{color:var(--cardinal);font-size:11px;margin-top:6px;display:none;}

  .section-title{ font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:1.5px; text-transform:uppercase; margin:0 0 10px; }

  .dash-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:28px; }
  .dash-card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px; cursor:pointer; }
  .dash-card:hover{ border-color:var(--myrtle); }
  .dash-card h4{ font-family:'Oswald',sans-serif; font-size:14px; margin:0 0 8px; color:var(--myrtle-dark); }
  .dash-stat-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:3px; }
  .dash-stat-row b{ color:var(--ink); }
  .dash-stat-row.hot b{ color:var(--cardinal); }

  .urgent-strip{margin-bottom:28px;}
  .urgent-empty{ font-size:13px; color:var(--ink-soft); font-style:italic; }
  .urgent-item{
    display:flex; align-items:center; gap:10px; background:var(--cardinal-tint); border-left:3px solid var(--cardinal);
    padding:8px 12px; border-radius:0 4px 4px 0; margin-bottom:6px; font-size:13px;
  }
  .urgent-item.medium{ background:var(--gold-tint); border-left-color:var(--gold); }
  .urgent-item .tag{ font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#79141F; font-weight:500; flex-shrink:0; }
  .urgent-item.medium .tag{ color:#7A5C0B; }
  .urgent-item .txt{flex:1;}
  .urgent-item .when{font-size:11px;color:#79141F;flex-shrink:0;}
  .urgent-item.medium .when{ color:#7A5C0B; }

  .tab-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .toolbar-left{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); }
  .toolbar-left label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .toolbar-right{ display:flex; align-items:center; gap:8px; }
  .ghost-btn{
    font-family:'Oswald',sans-serif; font-size:12px; background:none; border:1px solid var(--line); color:var(--myrtle-dark);
    border-radius:4px; padding:6px 12px; cursor:pointer;
  }
  .ghost-btn:hover{ background:var(--myrtle-tint); }
  .ghost-btn.done-btn{ border-color:var(--myrtle); background:var(--myrtle); color:#fff; }
  .ghost-btn.done-btn:hover{ background:var(--myrtle-dark); }
  .copy-wrap{ position:relative; }
  .toast{
    position:absolute; top:-26px; right:0; background:var(--ink); color:#fff; font-size:11px;
    padding:3px 8px; border-radius:4px; opacity:0; transition:opacity 0.2s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .task-list{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 16px 12px; }
  .task-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{ flex-shrink:0; width:15px; height:15px; cursor:pointer; accent-color:var(--myrtle); }
  .num{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; color:var(--myrtle); background:var(--myrtle-tint);
    border:1px solid var(--myrtle); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .task-row.done .num{ color:var(--done); border-color:var(--done); background:#F1EFE9; }
  .prio-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .prio-dot.high{ background:var(--cardinal); }
  .prio-dot.medium{ background:var(--gold); }
  .prio-dot.low{ background:var(--tan); }
  .task-text{ flex:1; font-size:13.5px; color:var(--ink); }
  .task-row.done .task-text{ color:var(--done); text-decoration:line-through; }
  .task-sponsor-tag{ font-size:10.5px; color:var(--myrtle-dark); background:var(--myrtle-tint); border-radius:10px; padding:2px 8px; flex-shrink:0; }
  .task-when{ font-size:11.5px; font-weight:600; width:78px; flex-shrink:0; }
  .task-when.thisweek{ color:var(--ink-soft); }
  .task-when.eow{ color:var(--cardinal); }
  .task-when.nextweek{ color:var(--gold); }
  .task-when.later{ color:var(--done); }
  select.status{
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600; padding:4px 8px; border-radius:12px; border:none; cursor:pointer; flex-shrink:0;
  }
  select.status.todo{background:var(--tan);color:#54503F;}
  select.status.progress{background:var(--myrtle-tint);color:var(--myrtle-dark);}
  select.status.waiting{background:var(--gold-tint);color:var(--gold);}
  select.status.done{background:#EDEBE4;color:var(--done);}
  .del-btn{ background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; padding:2px 4px; flex-shrink:0; }
  .del-btn:hover{color:var(--cardinal);}
  .empty-list{ text-align:center; color:var(--ink-soft); font-size:13px; padding:24px 0; font-style:italic; }

  .lockscreen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .lockbox{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:28px; width:100%; max-width:320px; text-align:center; }
  .lockbox h2{ font-family:'Oswald',sans-serif; font-size:18px; margin:0 0 4px; }
  .lockbox p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }
  .lockbox input{ width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; border:1px solid var(--tan); border-radius:6px; margin-bottom:10px; }
  .lockbox button{ width:100%; font-family:'Oswald',sans-serif; font-size:13px; background:var(--myrtle); color:#fff; border:none; border-radius:6px; padding:10px; cursor:pointer; }
  .lockbox button:hover{ background:var(--myrtle-dark); }
  .lockbox .lockerr{ color:var(--cardinal); font-size:12px; margin:8px 0 0; display:none; }
  .syncstatus{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; display:none; }
  .syncstatus.show{ display:block; }
  .syncstatus.err{ color:var(--cardinal); }

  .expand-toggle{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:11px; width:16px; flex-shrink:0; padding:0; }
  .expand-toggle:hover{ color:var(--myrtle); }
  .task-detail{ display:none; padding:10px 14px 14px 40px; background:var(--surface-soft, #f7f5f0); border-bottom:1px solid var(--line); }
  .task-detail.open{ display:block; }
  .task-detail label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin:8px 0 4px; }
  .task-detail label:first-child{ margin-top:0; }
  .task-notes{ width:100%; font-family:'Inter',sans-serif; font-size:13px; border:1px solid var(--tan); border-radius:6px; padding:8px 10px; resize:vertical; min-height:50px; box-sizing:border-box; }
  .link-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .link-pill{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--tan); border-radius:14px; padding:3px 10px; font-size:12px; }
  .link-pill button{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:11px; padding:0; }
  .link-pill button:hover{ color:var(--cardinal); }
  .link-pill .link-jump{ cursor:pointer; color:var(--myrtle); text-decoration:underline; background:none; border:none; font-size:12px; padding:0; }
  .link-add-row{ display:flex; gap:6px; margin-top:6px; }
  .link-add-row select{ flex:1; font-size:12px; padding:5px 8px; border:1px solid var(--tan); border-radius:6px; }
  .link-add-row button{ font-size:12px; padding:5px 10px; border:1px solid var(--tan); border-radius:6px; background:#fff; cursor:pointer; }
  .link-add-row button:hover{ background:var(--tan); }
  .no-links-note{ font-size:12px; color:var(--ink-soft); font-style:italic; }

  .note-card{ background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .note-head{ display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; }
  .note-head:hover{ background:var(--surface-soft, #f7f5f0); }
  .note-date{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .note-title{ font-weight:600; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-body{ display:none; padding:0 14px 14px; }
  .note-body.open{ display:block; }
  .note-body textarea{ width:100%; min-height:140px; font-family:'Inter',sans-serif; font-size:13px; line-height:1.5; border:1px solid var(--tan); border-radius:6px; padding:10px; resize:vertical; box-sizing:border-box; }
  .note-actions{ display:flex; justify-content:flex-end; margin-top:8px; }
  .note-form{ display:grid; gap:8px; }
  .note-form-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .note-form input[type=text]{ flex:1; min-width:160px; }
  .note-form input, .note-form select, .note-form textarea{ font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border:1px solid var(--tan); border-radius:6px; box-sizing:border-box; }
  .note-form textarea{ width:100%; min-height:110px; resize:vertical; }
  .note-filter{ margin:16px 0 12px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); }
  .note-filter select{ font-size:12px; padding:5px 8px; border:1px solid var(--tan); border-radius:6px; }

  .ns-section{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--tan); }
  .ns-section h4{ font-family:'Oswald',sans-serif; font-size:13px; font-weight:500; margin:0 0 8px; color:var(--myrtle); }
  .ns-item{ display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; }
  .ns-item .ns-status{ font-size:11px; color:var(--ink-soft); margin-left:auto; white-space:nowrap; }
  .ns-item.done .ns-text{ text-decoration:line-through; color:var(--ink-soft); }
  .ns-form{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .ns-form input[type=text]{ flex:1; min-width:160px; }
  .ns-form input, .ns-form select{ font-family:'Inter',sans-serif; font-size:12px; padding:6px 8px; border:1px solid var(--tan); border-radius:6px; box-sizing:border-box; }
  .ns-form button{ font-size:12px; padding:6px 12px; border:none; border-radius:6px; background:var(--myrtle); color:#fff; cursor:pointer; }
  .ns-form button:hover{ background:var(--myrtle-dark); }

  .view-toggle{ display:inline-flex; border:1px solid var(--tan); border-radius:6px; overflow:hidden; margin-bottom:12px; }
  .view-toggle button{ font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.5px; padding:6px 14px; border:none; background:#fff; color:var(--ink-soft); cursor:pointer; }
  .view-toggle button.on{ background:var(--myrtle); color:#fff; }

  .wip-info{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .wip-info label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:3px; }
  .wip-info input{ width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 9px; border:1px solid var(--tan); border-radius:6px; box-sizing:border-box; }
  .wip-summary{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .wip-summary-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .wip-pct{ font-family:'Oswald',sans-serif; font-size:15px; }
  .wip-bar{ height:8px; background:#e8e4da; border-radius:4px; overflow:hidden; margin-bottom:10px; }
  .wip-bar-fill{ height:100%; background:#3f8f5a; }
  .wip-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .wip-chip{ font-size:12px; padding:4px 10px; border-radius:14px; border:1px solid var(--tan); background:#fff; cursor:pointer; font-family:'Inter',sans-serif; }
  .wip-chip.on{ background:var(--myrtle); color:#fff; border-color:var(--myrtle); }
  .wip-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .wip-add{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .wip-add input, .wip-add select{ font-family:'Inter',sans-serif; font-size:12.5px; padding:7px 9px; border:1px solid var(--tan); border-radius:6px; box-sizing:border-box; }
  .wip-add input.grow{ flex:1; min-width:180px; }
  .wip-add button{ font-size:12.5px; padding:7px 14px; border:none; border-radius:6px; background:var(--myrtle); color:#fff; cursor:pointer; }
  .wip-scroll{ overflow-x:auto; }
  .wip-table{ min-width:1080px; }
  .wip-grid{ display:grid; grid-template-columns:2.2fr .8fr 1fr 1fr 1.05fr 2.2fr 1.6fr 28px; gap:8px; align-items:start; }
  .wip-head{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:0 10px 6px; }
  .wip-cat{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface-soft, #f7f5f0); border:1px solid var(--line); border-radius:6px; margin-top:10px; cursor:pointer; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.5px; }
  .wip-cat .cnt{ margin-left:auto; font-family:'Inter',sans-serif; font-size:11.5px; color:var(--ink-soft); letter-spacing:0; }
  .wip-row{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .wip-row input, .wip-row select, .wip-row textarea{ width:100%; font-family:'Inter',sans-serif; font-size:12.5px; padding:6px 8px; border:1px solid transparent; border-radius:6px; background:transparent; box-sizing:border-box; }
  .wip-row input:hover, .wip-row select:hover, .wip-row textarea:hover{ border-color:var(--tan); background:#fff; }
  .wip-row input:focus, .wip-row select:focus, .wip-row textarea:focus{ border-color:var(--myrtle); background:#fff; outline:none; }
  .wip-row textarea{ resize:vertical; min-height:34px; line-height:1.4; }
  .wip-row select.p-complete{ background:#e3f1e7; color:#2b6b43; font-weight:600; }
  .wip-row select.p-inprogress{ background:#fdf0d5; color:#8a5a00; font-weight:600; }
  .wip-row select.p-ongoing{ background:#dcebf5; color:#1f5578; font-weight:600; }
  .wip-row select.p-notstarted{ background:#eceae4; color:#5b574d; font-weight:600; }
  .wip-del{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:12px; padding:6px 0; }
  .wip-del:hover{ color:var(--cardinal); }

  .tabbar{ margin-bottom:0; }
  .subbar{ display:none; background:#faf8f3; border-bottom:1px solid var(--line); padding:2px 6px 0; }
  .subbar.show{ display:flex; }
  .subbar .tab{ font-size:12.5px; padding:7px 12px; }
  .tab.cat-tab{ font-weight:600; }
  .tab.drag-over-cat{ background:#e3f1e7; border-bottom-color:var(--myrtle); }
  .tab-count{ font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); margin-left:4px; }
  #content{ padding-top:20px; }
  .tab-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .movecat{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .movecat select{ font-size:12px; padding:5px 8px; border:1px solid var(--tan); border-radius:6px; background:#fff; }
  .cat-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .cat-hint{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
  .dash-card[draggable=true]{ cursor:grab; }
  .dash-card.dragging{ opacity:.4; }

  .wait-badge{ font-size:11px; padding:2px 8px; border-radius:10px; background:var(--gold-tint); color:#7A5C0B; white-space:nowrap; flex-shrink:0; }
  .wait-badge.chase{ background:var(--cardinal-tint); color:#79141F; font-weight:600; }
  .chased-btn{ font-size:11px; padding:2px 8px; border:1px solid var(--tan); border-radius:10px; background:#fff; cursor:pointer; flex-shrink:0; }
  .chased-btn:hover{ background:var(--tan); }
  .urgent-item.chase{ background:var(--gold-tint); border-left-color:var(--gold); }
  .urgent-item.chase .tag, .urgent-item.chase .when{ color:#7A5C0B; }
  .urgent-item.clickable{ cursor:pointer; }
  .urgent-item.clickable:hover{ filter:brightness(.97); }
  .due-over{ color:var(--cardinal); font-weight:600; }
  .wip-row input[type=date]{ padding:5px 6px; }
  .wip-row input.due-over{ color:var(--cardinal); font-weight:600; }

  .hosp-card{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }

===================================================================== -->

<script>
(function(){
  // ---- PASTE YOUR FIREBASE CONFIG HERE ----
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDdLBNDjw2d5NxKdYOnA3TbABLMEF1vUaM",
    authDomain: "souths-partnerships.firebaseapp.com",
    projectId: "souths-partnerships",
    storageBucket: "souths-partnerships.firebasestorage.app",
    messagingSenderId: "95437399161",
    appId: "1:95437399161:web:890c940428dfefe53f20a8"
  };
  // ---- SET YOUR SHARED PASSWORD HERE ----
  var SHARED_PASSWORD = "Emma2025!";

  firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.firestore();
  var DOC_REF = db.collection('partnershipsTracker').doc('data');

  function setSyncStatus(msg, isErr){
    var el = document.getElementById('syncStatus');
    if(!el) return;
    el.textContent = msg;
    el.className = 'syncstatus show' + (isErr ? ' err' : '');
  }

  // Simple shared-password gate. Not real security (this is a public
  // static site) -- just keeps casual visitors out.
  function initLock(){
    var unlocked = sessionStorage.getItem('prt-unlocked') === 'yes';
    if(unlocked){
      document.getElementById('lockscreen').style.display = 'none';
      document.getElementById('mainWrap').style.display = 'block';
      signInThenLoad();
      return;
    }
    var input = document.getElementById('lockInput');
    var btn = document.getElementById('lockBtn');
    var err = document.getElementById('lockErr');
    function tryUnlock(){
      if(input.value === SHARED_PASSWORD){
        sessionStorage.setItem('prt-unlocked', 'yes');
        document.getElementById('lockscreen').style.display = 'none';
        document.getElementById('mainWrap').style.display = 'block';
        signInThenLoad();
      } else {
        err.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }
    btn.onclick = tryUnlock;
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
    input.focus();
  }

  function signInThenLoad(){
    setSyncStatus('Connecting…', false);
    firebase.auth().signInAnonymously().then(function(){
      load();
    }).catch(function(err){
      setSyncStatus('Auth error — check your Firebase Authentication setup (' + err.message + ')', true);
    });
  }

  var TASKS_KEY = 'prt-tasks-v3';
  var SPONSORS_KEY = 'prt-sponsors-v3';
  var LASTWEEK_KEY = 'prt-lastweek-v1';
  var tasks = [];
  var sponsors = [];
  var activeTab = 'dashboard';
  var searchQuery = '';
  var selectedIds = new Set();
  var expandedIds = new Set();
  var dashView = 'attention';
  var wip = {};
  var partnerInfo = {};
  var infoOpen = new Set();
  var fixtures = { games: [], events: [] };
  var hosp = {};
  var tabCats = {};
  var CATS = [ { id:'sponsor', label:'Sponsors', single:'Sponsor' }, { id:'project', label:'Other Projects', single:'Project' } ];
  var sponsorView = 'tasks';
  var wipFilter = 'all';
  var wipCatOpen = {};
  var meetings = [];
  var expandedMeetings = new Set();
  var noteFilter = 'all';
  var dragSponsor = null;

  var WHEN_ORDER = { eow:0, thisweek:1, nextweek:2, later:3 };
  var WHEN_LABEL = { thisweek:'This week', eow:'EOW', nextweek:'Next week', later:'Later' };

  function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }
  function weekKey(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    var weekNum = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return date.getUTCFullYear() + '-W' + weekNum;
  }

  var suppressNextSnapshot = false; // avoid re-rendering from our own writes mid-edit
  var docLoaded = false;

  function applyRolloverIfNeeded(){
    var currentWeek = weekKey(new Date());
    var storedWeek = localStorage.getItem(LASTWEEK_KEY); // rollover marker is per-device, that's fine
    if(storedWeek && storedWeek !== currentWeek){
      var rolled = 0;
      tasks.forEach(function(t){
        if(t.status === 'done' || t.due) return;
        if(t.when === 'nextweek'){ t.when = 'thisweek'; rolled++; }
        else if(t.when === 'thisweek' || t.when === 'eow'){ t.when = 'thisweek'; rolled++; }
      });
      if(rolled > 0){
        saveTasks();
        var note = document.getElementById('rolloverNote');
        note.textContent = 'New week: ' + rolled + ' task' + (rolled===1?'':'s') + ' rolled forward automatically.';
        note.style.display = 'block';
      }
    }
    localStorage.setItem(LASTWEEK_KEY, currentWeek);
  }

  // Live sync: listen for changes from Firestore (this device or any other)
  // and re-render automatically when the shared data changes.
  function load(){
    setSyncStatus('Connecting…', false);
    DOC_REF.onSnapshot(function(doc){
      setSyncStatus('Synced', false);
      var data = doc.exists ? doc.data() : {};
      tasks = data.tasks ? JSON.parse(data.tasks) : [];
      sponsors = data.sponsors ? JSON.parse(data.sponsors) : [];
      meetings = data.meetings ? JSON.parse(data.meetings) : [];
      wip = data.wip ? JSON.parse(data.wip) : {};
      tabCats = data.tabCats ? JSON.parse(data.tabCats) : {};
      fixtures = data.fixtures ? JSON.parse(data.fixtures) : { games: [], events: [] };
      if(!fixtures.games) fixtures.games = [];
      if(!fixtures.events) fixtures.events = [];
      hosp = data.hosp ? JSON.parse(data.hosp) : {};
      partnerInfo = data.partnerInfo ? JSON.parse(data.partnerInfo) : {};
      tasks.forEach(function(t){
        if(sponsors.indexOf(t.sponsor) === -1) sponsors.push(t.sponsor);
        if(!WHEN_ORDER.hasOwnProperty(t.when)) t.when = 'thisweek';
        if(t.due) t.when = whenFromDue(t.due);
        if(typeof t.notes !== 'string') t.notes = '';
        if(!Array.isArray(t.links)) t.links = [];
      });
      var validIds = tasks.map(function(t){ return t.id; });
      tasks.forEach(function(t){
        t.links = t.links.filter(function(lid){ return validIds.indexOf(lid) !== -1; });
      });
      if(!docLoaded){ docLoaded = true; applyRolloverIfNeeded(); }
      var needsDate = false;
      tasks.forEach(function(t){ if(t.status === 'waiting' && !t.waitingSince){ t.waitingSince = todayStr(); needsDate = true; } });
      if(needsDate) saveTasks();
      render();
    }, function(err){
      setSyncStatus('Sync error — check your Firebase setup (' + err.message + ')', true);
    });
  }
  function saveTasks(){
    DOC_REF.set({ tasks: JSON.stringify(tasks) }, { merge: true }).catch(function(err){
      setSyncStatus('Save failed — check your connection', true);
    });
  }
  function saveSponsors(){
    DOC_REF.set({ sponsors: JSON.stringify(sponsors) }, { merge: true }).catch(function(err){
      setSyncStatus('Save failed — check your connection', true);
    });
  }

  function saveMeetings(){
    DOC_REF.set({ meetings: JSON.stringify(meetings) }, { merge: true }).catch(function(err){
      setSyncStatus('Save failed, check your connection', true);
    });
  }

  function tasksFor(sponsor){ return tasks.filter(function(t){ return t.sponsor === sponsor; }); }

  function saveTabCats(){
    DOC_REF.set({ tabCats: JSON.stringify(tabCats) }, { merge: true }).catch(function(err){
      setSyncStatus('Save failed, check your connection', true);
    });
  }
  function catOf(name){ return tabCats[name] === 'project' ? 'project' : 'sponsor'; }
  function tabsIn(cat){ return sponsors.filter(function(n){ return catOf(n) === cat; }); }
  function catDef(id){ return CATS.filter(function(c){ return c.id === id; })[0]; }
  function currentGroup(){
    if(activeTab === '__cat_sponsor__') return 'sponsor';
    if(activeTab === '__cat_project__') return 'project';
    if(sponsors.indexOf(activeTab) !== -1) return catOf(activeTab);
    return null;
  }
  function openAddRow(cat){
    document.getElementById('newSponsorCat').value = cat || currentGroup() || 'sponsor';
    document.getElementById('newSponsorRow').style.display = 'flex';
    document.getElementById('newSponsorInput').focus();
  }
  function moveTabToCat(name, cat){
    if(sponsors.indexOf(name) === -1) return;
    tabCats[name] = cat;
    saveTabCats();
  }

  function renderTabs(){
    var bar = document.getElementById('tabbar');
    var sub = document.getElementById('subbar');
    var group = currentGroup();

    var html = '<button class="tab ' + (activeTab==='dashboard'?'active':'') + '" data-tab="dashboard">Dashboard</button>';
    html += '<button class="tab ' + (activeTab==='__notes__'?'active':'') + '" data-tab="__notes__">Meeting notes</button>';
    html += '<button class="tab ' + (activeTab==='__fixtures__'?'active':'') + '" data-tab="__fixtures__">Fixtures</button>';
    CATS.forEach(function(c){
      html += '<button class="tab cat-tab ' + (group===c.id?'active':'') + '" data-tab="__cat_' + c.id + '__" data-cat="' + c.id + '">' +
        c.label + '<span class="tab-count">' + tabsIn(c.id).length + '</span></button>';
    });
    bar.innerHTML = html;

    if(group){
      var shtml = tabsIn(group).map(function(n){
        return '<button class="tab ' + (activeTab===n?'active':'') + '" draggable="true" data-tab="' + escapeHtml(n) + '">' + escapeHtml(n) + '</button>';
      }).join('');
      shtml += '<button class="tab addtab" id="addTabBtn" aria-label="Add tab">+</button>';
      sub.innerHTML = shtml;
      sub.className = 'tabbar subbar show';
    } else {
      sub.innerHTML = '';
      sub.className = 'tabbar subbar';
    }

    function wire(root){
      root.querySelectorAll('.tab[data-tab]').forEach(function(btn){
        var isCat = btn.hasAttribute('data-cat');
        btn.onclick = function(){
          activeTab = btn.getAttribute('data-tab');
          selectedIds.clear();
          document.getElementById('newSponsorRow').style.display = 'none';
          document.getElementById('globalSearch').value = '';
          searchQuery = '';
          render();
        };
        btn.addEventListener('dragstart', function(){
          dragSponsor = btn.getAttribute('data-tab');
          btn.classList.add('dragging');
        });
        btn.addEventListener('dragend', function(){
          btn.classList.remove('dragging');
          dragSponsor = null;
          document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('drag-over'); b.classList.remove('drag-over-cat'); });
        });
        btn.addEventListener('dragover', function(e){
          if(!dragSponsor) return;
          var isMember = sponsors.indexOf(btn.getAttribute('data-tab')) !== -1;
          if(!isCat && !isMember) return;
          e.preventDefault();
          btn.classList.add(isCat ? 'drag-over-cat' : 'drag-over');
        });
        btn.addEventListener('dragleave', function(){ btn.classList.remove('drag-over'); btn.classList.remove('drag-over-cat'); });
        btn.addEventListener('drop', function(e){
          e.preventDefault();
          btn.classList.remove('drag-over'); btn.classList.remove('drag-over-cat');
          if(!dragSponsor) return;
          var moving = dragSponsor;
          if(isCat){
            dragSponsor = null;
            moveTabToCat(moving, btn.getAttribute('data-cat'));
            render();
            return;
          }
          var target = btn.getAttribute('data-tab');
          if(moving === target) return;
          var from = sponsors.indexOf(moving);
          var to = sponsors.indexOf(target);
          if(from === -1 || to === -1) return;
          sponsors.splice(from, 1);
          sponsors.splice(to, 0, moving);
          dragSponsor = null;
          saveSponsors(); render();
        });
      });
    }
    wire(bar);
    wire(sub);
    var addBtn = document.getElementById('addTabBtn');
    if(addBtn) addBtn.onclick = function(){ openAddRow(group); };
  }

  function statCardHtml(s){
    var list = tasksFor(s);
    var openCount = list.filter(function(t){ return t.status !== 'done'; }).length;
    var thisWeekCount = list.filter(function(t){ return t.status !== 'done' && (t.when === 'thisweek' || t.when === 'eow'); }).length;
    var waitingCount = list.filter(function(t){ return t.status === 'waiting'; }).length;
    var highCount = list.filter(function(t){ return t.status !== 'done' && t.priority === 'high'; }).length;
    var delivered = '';
    if(catOf(s) === 'sponsor'){
      var wi = wipItemsFor(s);
      if(wi.length){
        var wd = wi.filter(function(i){ return i.progress === 'Complete'; }).length;
        delivered = '<div class="dash-stat-row"><span>Deliverables</span><b>' + wd + '/' + wi.length + '</b></div>';
      }
    }
    return '<div class="dash-card" draggable="true" data-tab="' + escapeHtml(s) + '">' +
      '<h4>' + escapeHtml(s) + '</h4>' +
      '<div class="dash-stat-row"><span>Open</span><b>' + openCount + '</b></div>' +
      '<div class="dash-stat-row hot"><span>Due this week</span><b>' + thisWeekCount + '</b></div>' +
      '<div class="dash-stat-row"><span>Waiting</span><b>' + waitingCount + '</b></div>' +
      '<div class="dash-stat-row"><span>High priority</span><b>' + highCount + '</b></div>' +
      delivered +
    '</div>';
  }

  function attachCardHandlers(host){

  function renderDashboard(){
    var host = document.getElementById('content');

    var urgent = open.filter(function(t){

    }).sort(function(a,b){
      if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1; if(WHEN_ORDER[a.when] !== WHEN_ORDER[b.when]) return WHEN_ORDER[a.when] - WHEN_ORDER[b.when]; var dc = dueCmp(a, b); if(dc) return dc;
      var order = { high:0, medium:1, low:2 };

    var urgentHtml = urgent.length === 0

    var rsvpHtml = rsvpList.length === 0 ? '' :

          '<span class="tag">' + escapeHtml(u.sponsor) + '</span>' +

    var renewList = [];

      renewList.map(function(r){

          '<span class="txt">' + (r.dd < 0 ? 'Contract ended' : 'Contract ends') + ' ' + escapeHtml(prettyDate(r.end)) + '</span>' +

    var allSorted = open.slice().sort(function(a,b){
      if(a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1; if(WHEN_ORDER[a.when] !== WHEN_ORDER[b.when]) return WHEN_ORDER[a.when] - WHEN_ORDER[b.when]; var dc = dueCmp(a, b); if(dc) return dc;
      var order = { high:0, medium:1, low:2 };
      return order[a.priority] - order[b.priority];
    });
    var allOpenHtml = allSorted.length === 0

      : allSorted.map(function(t, idx){ return taskRowHtml(t, idx, true); }).join('');

    var cardsHtml = CATS.map(function(c){
      var members = tabsIn(c.id);
      if(!members.length) return '';
      return '<h2 class="section-title" style="color:var(--myrtle);">' + c.label + '</h2>' +
        '<div class="dash-grid" style="margin-bottom:22px;">' + members.map(statCardHtml).join('') + '</div>';
    }).join('');

    var quickAddHtml = sponsors.length === 0 ? '' :
      '<div class="add-panel">' +
        '<div class="add-row">' +
          '<input type="text" id="qaText" placeholder="Quick add a task...">' +
          '<select id="qaSponsor">' + sponsorOptionsHtml() + '</select>' +
          '<input type="date" id="qaDue" title="Due date (optional)">' +
          '<select id="qaPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>' +
          '<select id="qaStatus"><option value="todo">To do</option><option value="progress">In progress</option><option value="waiting">Waiting</option></select>' +
          '<button id="qaAddBtn">Add</button>' +
        '</div>' +
        dueChipsHtml('#qaDue') +
        '<p class="field-err" id="qaErr">Enter a task before adding.</p>' +
      '</div>';

    host.innerHTML = quickAddHtml +
      '<div class="view-toggle">' +
        '<button data-dashview="attention" class="' + (dashView==='attention'?'on':'') + '">Needs attention</button>' +
        '<button data-dashview="all" class="' + (dashView==='all'?'on':'') + '">All open tasks (' + open.length + ')</button>' +
      '</div>' +
      (dashView === 'all'
        ? '<div class="urgent-strip"><div class="task-list">' + allOpenHtml + '</div></div>'
        : '<div class="urgent-strip"><h2 class="section-title" style="color:var(--cardinal);">Needs attention</h2>' + urgentHtml + '</div>' + chaseHtml + upcomingHtml + rsvpHtml + renewHtml) +
      (cardsHtml || '<p class="empty-list">No tabs yet. Open Sponsors or Other Projects above and use the + button to add one.</p>');

    host.querySelectorAll('[data-dashview]').forEach(function(b){
      b.onclick = function(){ dashView = b.getAttribute('data-dashview'); selectedIds.clear(); render(); };
    });
    if(dashView === 'all') attachRowHandlers(host);
    attachChasedHandlers(host);
    attachTaskJumps(host);
    attachDueChips(host);
    host.querySelectorAll('[data-gosponsor]').forEach(function(el){
      el.onclick = function(){ goToResult('info', el.getAttribute('data-gosponsor'), el.getAttribute('data-gosponsor')); };
    });
    host.querySelectorAll('[data-gohosp]').forEach(function(el){
      el.onclick = function(){ activeTab = el.getAttribute('data-gohosp'); sponsorView = 'hosp'; render(); };
    });
    host.querySelectorAll('[data-gowip]').forEach(function(el){
      el.onclick = function(){ activeTab = el.getAttribute('data-gowip'); sponsorView = 'wip'; wipFilter = 'all'; render(); };
    });

    attachCardHandlers(host);

    if(sponsors.length > 0){
      document.getElementById('qaAddBtn').onclick = function(){
        var textEl = document.getElementById('qaText');
        var text = textEl.value.trim();
        var err = document.getElementById('qaErr');
        if(!text){ err.style.display = 'block'; return; }
        err.style.display = 'none';
        var qaDueVal = document.getElementById('qaDue').value;
        tasks.push({
          id: uid(), text: text, sponsor: document.getElementById('qaSponsor').value,
          due: qaDueVal, when: qaDueVal ? whenFromDue(qaDueVal) : 'later', priority: document.getElementById('qaPriority').value,
          status: document.getElementById('qaStatus').value, notes: '', links: []
        });
        setStatus(tasks[tasks.length-1], document.getElementById('qaStatus').value);
        saveTasks(); render();
      };
      document.getElementById('qaText').addEventListener('keydown', function(e){
        if(e.key === 'Enter') document.getElementById('qaAddBtn').click();
      });
    }
  }

  var CHASE_DAYS = 5;
  function daysSince(dateStr){
    var p = (dateStr || '').split('-');
    if(p.length !== 3) return 0;
    var a = Date.UTC(+p[0], +p[1]-1, +p[2]);
    var n = new Date();
    var b = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.max(0, Math.floor((b - a) / 86400000));
  }
  function setStatus(t, st){
    t.status = st;
    if(st === 'waiting'){ t.waitingSince = todayStr(); }
    else { delete t.waitingSince; }
  }
  function waitBadgeHtml(t){
    if(t.status !== 'waiting' || !t.waitingSince) return '';
    var d = daysSince(t.waitingSince);
    return '<span class="wait-badge ' + (d >= CHASE_DAYS ? 'chase' : '') + '" title="Waiting since ' + escAttr(prettyDate(t.waitingSince)) + '">' +
      (d === 0 ? 'Waiting today' : 'Waiting ' + d + 'd') + '</span>' +
      '<button class="chased-btn" data-chased="' + t.id + '" title="Reset the waiting clock">Chased</button>';
  }
  function jumpToTask(id){
    var t = taskById(id);
    if(!t) return;
    selectedIds.clear();
    sponsorView = 'tasks';
    expandedIds.add(id);
    activeTab = t.sponsor;
    document.getElementById('globalSearch').value = '';
    searchQuery = '';
    render();
    setTimeout(function(){
      var row = document.querySelector('.task-row[data-id="' + id + '"]');
      if(row){
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.add('flash');
        setTimeout(function(){ row.classList.remove('flash'); }, 2500);
      }
    }, 60);
  }
  function attachTaskJumps(host){
    host.querySelectorAll('[data-gotask]').forEach(function(el){
      el.onclick = function(){ jumpToTask(el.getAttribute('data-gotask')); };
    });
  }

  function attachChasedHandlers(host){
    host.querySelectorAll('[data-chased]').forEach(function(el){
      el.onclick = function(e){
        e.stopPropagation();
        var t = taskById(el.getAttribute('data-chased'));
        if(t){ t.waitingSince = todayStr(); saveTasks(); render(); }
      };
    });
  }

  function parseYMD(str){ var p = str.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayDiff(str){
    var a = parseYMD(str);
    var n = new Date();
    var b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((a - b) / 86400000);
  }
  // Turns a real due date into the bucket the rest of the tracker uses (EOW, this week, next week, later)
  function whenFromDue(str){
    var diff = dayDiff(str);
    var dow = (new Date().getDay() + 6) % 7; // Monday = 0
    var toSunday = 6 - dow;
    if(diff <= toSunday){
      if(diff < 0) return 'eow';
      var d = parseYMD(str).getDay();
      return (d === 5 || d === 6 || d === 0) ? 'eow' : 'thisweek';
    }
    if(diff <= toSunday + 7) return 'nextweek';
    return 'later';
  }
  function syncWhen(t){ if(t.due) t.when = whenFromDue(t.due); }
  function dueCmp(a, b){
    if(a.due && b.due) return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
    if(a.due) return -1;
    if(b.due) return 1;
    return 0;
  }
  function shortDate(str){
    var d = parseYMD(str);
    var out = d.toLocaleDateString('en-AU', { weekday: 'short' }) + ' ' + d.getDate() + ' ' + d.toLocaleDateString('en-AU', { month: 'short' });
    if(d.getFullYear() !== new Date().getFullYear()) out += ' ' + d.getFullYear();
    return out;
  }
  function dueLabel(t){
    if(!t.due) return { text: t.when === 'later' ? 'No date' : WHEN_LABEL[t.when], nodate: t.when === 'later', over: false };
    var diff = dayDiff(t.due);
    if(t.status !== 'done' && diff < 0) return { text: 'Overdue, ' + shortDate(t.due), over: true };
    if(diff === 0) return { text: 'Today', over: false };
    if(diff === 1) return { text: 'Tomorrow', over: false };
    return { text: shortDate(t.due), over: false };
  }
  function dueCellHtml(t){
    var l = dueLabel(t);
    return '<label class="task-when ' + t.when + ' due-wrap' + (l.over ? ' over' : '') + (l.nodate ? ' nodate' : '') + '" title="Click to set a due date">' +
      '<span>' + escapeHtml(l.text) + '</span>' +
      '<input type="date" class="due-input" data-dueid="' + t.id + '" value="' + escAttr(t.due || '') + '"></label>';
  }
  function chipDate(kind){
    var d = new Date();
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if(kind === 'tomorrow') d.setDate(d.getDate() + 1);
    else if(kind === 'fri'){ var add = (5 - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); }
    else if(kind === 'mon'){ var add2 = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + add2); }
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dueChipsHtml(targetSelector){
    return '<div class="due-chips" data-chipfor="' + escAttr(targetSelector) + '">Due:' +
      '<button type="button" data-chip="today">Today</button>' +
      '<button type="button" data-chip="tomorrow">Tomorrow</button>' +
      '<button type="button" data-chip="fri">Friday</button>' +
      '<button type="button" data-chip="mon">Next Monday</button>' +
    '</div>';
  }
  function attachDueChips(host){
    host.querySelectorAll('.due-chips').forEach(function(box){
      box.querySelectorAll('[data-chip]').forEach(function(btn){
        btn.onclick = function(){
          var inp = document.querySelector(box.getAttribute('data-chipfor'));
          if(inp){ inp.value = chipDate(btn.getAttribute('data-chip')); }
        };
      });
    });
  }

  function taskById(id){
    return tasks.find(function(x){ return x.id === id; });
  }

  function taskLabel(t){
    return (t ? t.text + ' (' + t.sponsor + ')' : '[deleted task]');
  }

  function taskRowHtml(t, idx, showSponsorTag){
    var isOpen = expandedIds.has(t.id);
    var row = '<div class="task-row ' + (t.status === 'done' ? 'done' : '') + '" data-id="' + t.id + '">' +
      '<button class="expand-toggle" data-id="' + t.id + '" aria-label="Toggle notes and links">' + (isOpen ? '&#9662;' : '&#9656;') + '</button>' +
      '<input type="checkbox" class="rowcheck" data-id="' + t.id + '" ' + (selectedIds.has(t.id) ? 'checked' : '') + '>' +
      '<span class="num">' + (idx+1) + '</span>' +
      '<span class="prio-dot ' + t.priority + '" title="' + t.priority + ' priority"></span>' +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' +
      (showSponsorTag ? '<span class="task-sponsor-tag">' + escapeHtml(t.sponsor) + '</span>' : '') +
      dueCellHtml(t) +
      waitBadgeHtml(t) +
      '<select class="status ' + t.status + '" data-id="' + t.id + '">' +
        '<option value="todo"' + (t.status==='todo'?' selected':'') + '>To do</option>' +
        '<option value="progress"' + (t.status==='progress'?' selected':'') + '>In progress</option>' +
        '<option value="waiting"' + (t.status==='waiting'?' selected':'') + '>Waiting</option>' +
        '<option value="done"' + (t.status==='done'?' selected':'') + '>Done</option>' +
      '</select>' +
      '<button class="del-btn" data-id="' + t.id + '" aria-label="Delete task">&#10005;</button>' +
    '</div>';

    var otherTasks = tasks.filter(function(x){ return x.id !== t.id && (t.links||[]).indexOf(x.id) === -1; });
    var linkOptions = otherTasks.map(function(x){
      return '<option value="' + x.id + '">' + escapeHtml(taskLabel(x)) + '</option>';
    }).join('');
    var linkPills = (t.links||[]).map(function(lid){
      var linked = taskById(lid);
      return '<span class="link-pill">' +
        '<button class="link-jump" data-jump="' + lid + '">' + escapeHtml(taskLabel(linked)) + '</button>' +
        '<button class="link-remove" data-owner="' + t.id + '" data-remove="' + lid + '" aria-label="Remove link">&#10005;</button>' +
      '</span>';
    }).join('');

    var detail = '<div class="task-detail ' + (isOpen ? 'open' : '') + '" data-detail-for="' + t.id + '">' +
      '<label>Notes / where it\'s at</label>' +
      '<textarea class="task-notes" data-notes-for="' + t.id + '" placeholder="e.g. Waiting on creative sign-off from partner, chased 12/08...">' + escapeHtml(t.notes || '') + '</textarea>' +
      '<label>Linked tasks</label>' +
      '<div class="link-row" data-linkrow-for="' + t.id + '">' +
        (linkPills || '<span class="no-links-note">No linked tasks.</span>') +
      '</div>' +
      (otherTasks.length > 0 ?
        '<div class="link-add-row">' +
          '<select data-linkselect-for="' + t.id + '"><option value="">Link to a task…</option>' + linkOptions + '</select>' +
          '<button class="link-add-btn" data-id="' + t.id + '">Link</button>' +
        '</div>'
      : '') +
    '</div>';

    return row + detail;
  }

  function attachRowHandlers(host){
    attachChasedHandlers(host);
    attachDueChips(host);
    host.querySelectorAll('.due-input').forEach(function(el){
      el.onclick = function(){ if(el.showPicker){ try{ el.showPicker(); }catch(e){} } };
      el.onchange = function(){
        var t = taskById(el.getAttribute('data-dueid'));
        if(!t) return;
        if(el.value){ t.due = el.value; syncWhen(t); }
        else { t.due = ''; t.when = 'later'; }
        saveTasks(); render();
      };
    });
    host.querySelectorAll('select.status').forEach(function(el){
      el.onchange = function(){
        var id = el.getAttribute('data-id');
        var t = tasks.find(function(x){ return x.id === id; });
        if(t){ setStatus(t, el.value); saveTasks(); render(); }
      };
    });
    host.querySelectorAll('.del-btn').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-id');
        tasks = tasks.filter(function(x){ return x.id !== id; });
        tasks.forEach(function(x){
          if(x.links) x.links = x.links.filter(function(lid){ return lid !== id; });
        });
        selectedIds.delete(id);
        expandedIds.delete(id);
        saveTasks(); render();
      };
    });
    host.querySelectorAll('.rowcheck').forEach(function(el){
      el.onchange = function(){
        var id = el.getAttribute('data-id');
        if(el.checked) selectedIds.add(id); else selectedIds.delete(id);
        renderToolbar();
      };
    });
    host.querySelectorAll('.expand-toggle').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-id');
        if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
        render();
      };
    });
    host.querySelectorAll('.task-notes').forEach(function(el){
      el.onblur = function(){
        var id = el.getAttribute('data-notes-for');
        var t = taskById(id);
        if(t && t.notes !== el.value){ t.notes = el.value; saveTasks(); }
      };
    });
    host.querySelectorAll('.link-add-btn').forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-id');
        var select = host.querySelector('[data-linkselect-for="' + id + '"]');
        var targetId = select ? select.value : '';
        if(!targetId) return;
        var t = taskById(id);
        var other = taskById(targetId);
        if(!t || !other) return;
        t.links = t.links || [];
        other.links = other.links || [];
        if(t.links.indexOf(targetId) === -1) t.links.push(targetId);
        if(other.links.indexOf(id) === -1) other.links.push(id); // linking is mutual, shows on both tasks
        saveTasks(); render();
      };

    host.querySelectorAll('.link-remove').forEach(function(el){

  function buildSummary(sponsor){
    var list = tasksFor(sponsor).filter(function(t){ return t.status !== 'done'; }).sort(function(a, b){ return dueCmp(a, b); });
    var lines = [sponsor + ': task update'];
    if(list.length === 0){ lines.push('', 'Nothing open.'); return lines.join('\n'); }
    function bucket(t){
      if(t.due && t.due < todayStr()) return 'Overdue';
      if(t.when === 'eow' || t.when === 'thisweek') return 'This week';
      if(t.when === 'nextweek') return 'Next week';
      return 'Later';
    }
    ['Overdue', 'This week', 'Next week', 'Later'].forEach(function(name){
      var items = list.filter(function(t){ return bucket(t) === name; });
      if(items.length === 0) return;
      lines.push('', name + ':');
      items.forEach(function(t){
        lines.push('- ' + t.text + (t.due ? ' (due ' + shortDate(t.due) + ')' : '') + (t.priority === 'high' ? ' (high priority)' : '') + (t.status === 'waiting' ? ' [waiting on partner/other]' : ''));
      });
    });
    return lines.join('\n');
  }

  var WIP_PROGRESS = ['Not started', 'In progress', 'Ongoing', 'Complete'];
  var WIP_CLASS = { 'Complete':'p-complete', 'In progress':'p-inprogress', 'Ongoing':'p-ongoing', 'Not started':'p-notstarted' };

  function escAttr(v){ return escapeHtml(v).replace(/"/g, '&quot;'); }
  function wipItemsFor(sp){ return (wip[sp] && wip[sp].items) ? wip[sp].items : []; }
  function wipEnsure(sp){
    if(!wip[sp]) wip[sp] = { info: { designation:'', contacts:'', objectives:'' }, items: [] };
    if(!wip[sp].info) wip[sp].info = { designation:'', contacts:'', objectives:'' };
    if(!wip[sp].items) wip[sp].items = [];
    return wip[sp];
  }

  function normDue(v){
    if(v === '' || v == null) return '';
    function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    if(typeof v === 'number' && v > 20000){ var d0 = new Date(Math.round((v - 25569) * 86400 * 1000)); return d0.getUTCFullYear() + '-' + String(d0.getUTCMonth()+1).padStart(2,'0') + '-' + String(d0.getUTCDate()).padStart(2,'0'); }
    var t = String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
    var parsed = new Date(t);
    return isNaN(parsed.getTime()) ? '' : iso(parsed);
  }

  function normProgress(v){
    var t = String(v == null ? '' : v).toLowerCase();
    if(t.indexOf('complete') !== -1 && t.indexOf('incomplete') === -1) return 'Complete';
    if(t.indexOf('progress') !== -1) return 'In progress';
    if(t.indexOf('ongoing') !== -1) return 'Ongoing';
    return 'Not started';
  }

  // Reads the layout of the club's existing WIP spreadsheets (Sponsorship Overview tab)
  function parseWipRows(rows){
    function clean(v){ return String(v == null ? '' : v).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim(); }
    function raw(v){ return String(v == null ? '' : v).replace(/\r/g, '').trim(); }
    var info = { designation:'', contacts:'', objectives:'' };
    var hdr = -1;
    for(var i = 0; i < rows.length; i++){
      var r = rows[i] || [];
      var label = clean(r[0]).toLowerCase();
      if(label === 'category designation') info.designation = clean(r[1]);
      else if(label === 'contact' || label === 'contacts') info.contacts = clean(r[1]);
      else if(label === 'sponsor objectives' || label === 'objectives') info.objectives = clean(r[1]);
      var hasDel = r.some(function(c){ return clean(c).toLowerCase().indexOf('contracted deliverable') === 0; });
      if(hasDel){ hdr = i; break; }
    }
    if(hdr < 0) return null;
    var col = {};
    rows[hdr].forEach(function(c, idx){
      var h = clean(c).toLowerCase();
      if(h === 'category') col.cat = idx;
      else if(h.indexOf('contracted deliverable') === 0) col.name = idx;
      else if(h === 'quantity') col.qty = idx;
      else if(h === 'responsibility') col.resp = idx;
      else if(h === 'actions') col.actions = idx;
      else if(h === 'progress') col.prog = idx;
      else if(h.indexOf('comment') !== -1) col.comments = idx;
      else if(h === 'due' || h === 'due date') col.due = idx;
    });
    if(col.name == null) return null;
    var items = [];
    var cat = '';
    for(var j = hdr + 1; j < rows.length; j++){
      var row = rows[j] || [];
      var name = clean(row[col.name]);
      var c = col.cat != null ? clean(row[col.cat]) : '';
      if(c) cat = c;
      if(!name) continue;
      items.push({
        id: uid(), category: cat || 'General', name: name,
        qty: col.qty != null ? clean(row[col.qty]) : '',
        resp: col.resp != null ? clean(row[col.resp]) : '',
        actions: col.actions != null ? raw(row[col.actions]) : '',
        progress: normProgress(col.prog != null ? row[col.prog] : ''),
        comments: col.comments != null ? raw(row[col.comments]) : '',
        due: col.due != null ? normDue(row[col.due]) : ''
      });
    }
    return { info: info, items: items };
  }

  function buildWipSummary(sponsor){
    var w = wip[sponsor] || { info:{}, items:[] };

    var out = ['WIP update: ' + sponsor, 'Date: ' + prettyDate(todayStr()), 'Delivered so far: ' + done + ' of ' + items.length + ' deliverables complete (' + pct + '%)', ''];
    ['In progress', 'Ongoing', 'Not started'].forEach(function(st){
      var list = items.filter(function(i){ return i.progress === st; });
      if(!list.length) return;
      out.push(st.toUpperCase());
      list.forEach(function(i){
        var line = '- ' + i.name + (i.qty ? ' (' + i.qty + ')' : '') + (i.due ? ' [due ' + prettyDate(i.due) + ']' : '');

  var MONTHS_3 = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var WEEKDAYS_3 = ['sun','mon','tue','wed','thu','fri','sat'];
  function pad2(n){ return String(n).padStart(2, '0'); }
  function isoOf(y, m, d){ return y + '-' + pad2(m) + '-' + pad2(d); }
  function defaultSeasonYear(){ var n = new Date(); return n.getMonth() >= 8 ? n.getFullYear() + 1 : n.getFullYear(); }

  // Reads dates written the way the club writes them, e.g. "Saturday 21st March, 7:30pm"
  function parseLooseDate(v, defYear){
    var out = { date: '', time: '' };
    if(v === '' || v == null) return out;
    if(typeof v === 'number'){
      if(v > 20000){
        var d0 = new Date(Math.round((v - 25569) * 86400 * 1000));
        out.date = isoOf(d0.getUTCFullYear(), d0.getUTCMonth() + 1, d0.getUTCDate());
        var frac = v - Math.floor(v);
        if(frac > 0){ var mins = Math.round(frac * 1440); out.time = pad2(Math.floor(mins / 60) % 24) + ':' + pad2(mins % 60); }
      }
      return out;
    }
    var t = String(v).trim();
    var tm = t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if(tm){
      var hh = (+tm[1]) % 12;
      if(/pm/i.test(tm[3])) hh += 12;
      out.time = pad2(hh) + ':' + (tm[2] || '00');
      t = t.replace(tm[0], ' ');
    } else {
      var t24 = t.match(/\b(\d{1,2}):(\d{2})\b/);
      if(t24){ out.time = pad2(+t24[1]) + ':' + t24[2]; t = t.replace(t24[0], ' '); }
    }
    var m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m){ out.date = m[0]; return out; }
    m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m){ var yy = +m[3]; if(yy < 100) yy += 2000; out.date = isoOf(yy, +m[2], +m[1]); return out; }
    m = t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?(?:,?\s*(\d{4}))?/);
    if(m){
      var mi = MONTHS_3.indexOf(m[2].slice(0, 3).toLowerCase());
      if(mi !== -1){
        var day = +m[1];
        var yr = m[3] ? +m[3] : 0;
        if(!yr){
          var base = defYear || defaultSeasonYear();
          yr = base;
          var wd = t.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/i);
          if(wd){
            var wi = WEEKDAYS_3.indexOf(wd[1].toLowerCase());
            [base, base - 1, base + 1, base - 2, base + 2].some(function(y){
              if(new Date(y, mi, day).getDay() === wi){ yr = y; return true; }
              return false;
            });
          }
        }
        out.date = isoOf(yr, mi + 1, day);
      }
    }
    return out;
  }

  function fmtTime(hhmm){
    if(!hhmm) return '';
    var p = hhmm.split(':');
    var h = +p[0];
    var ap = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + p[1] + ap;
  }
  function fmtDateTime(date, time, long){
    if(!date) return time ? fmtTime(time) : '';
    var p = date.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var opts = long ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'short' };
    return d.toLocaleDateString('en-AU', opts) + (time ? ', ' + fmtTime(time) : '');
  }
  function sortFixtures(list){
    return list.slice().sort(function(a, b){
      var da = a.date || '9999', db = b.date || '9999';
      if(da !== db) return da < db ? -1 : 1;
      return String(a.round || a.name || '').localeCompare(String(b.round || b.name || ''), undefined, { numeric: true });
    });
  }
  function gameLabel(g){ return (g.round ? 'Round ' + g.round + ' ' : '') + 'vs ' + (g.opponent || 'TBC'); }

  function hospFor(sp){ return hosp[sp] || { types: [], rows: {} }; }
  function hospEnsure(sp){
    if(!hosp[sp]) hosp[sp] = { types: [], rows: {} };
    if(!hosp[sp].types) hosp[sp].types = [];
    if(!hosp[sp].rows) hosp[sp].rows = {};
    return hosp[sp];
  }
  function hospHasData(sp){
    var h = hosp[sp];
    return !!(h && ((h.types && h.types.length) || (h.rows && Object.keys(h.rows).length)));
  }
  function allocatedFor(sp, typeId){
    var rows = hospFor(sp).rows || {};
    var n = 0;
    Object.keys(rows).forEach(function(fid){
      var a = rows[fid] && rows[fid].alloc ? rows[fid].alloc[typeId] : 0;
      if(a) n += (+a || 0);
    });
    return n;
  }

  // Reads the "Hospitality & Ticketing" tab layout used in the club's partner WIP sheets
  function parseHospRows(rows, defYear){
    function clean(v){ return String(v == null ? '' : v).replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim(); }
    function norm(v){ return clean(v).toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function blank(r){ return !r || r.every(function(c){ return clean(c) === ''; }); }
    function mapCols(r){
      var c = { allocs: [] };
      r.forEach(function(cell, idx){
        var h = clean(cell).toLowerCase();
        if(!h) return;
        if(h.indexOf('rsvp') !== -1) c.rsvp = idx;
        else if(h.indexOf('note') !== -1 || h.indexOf('comment') !== -1) c.notes = idx;
        else if(h.indexOf('allocat') !== -1) c.allocs.push({ idx: idx, head: norm(cell) });
        else if(h.indexOf('corporate event') === 0 || h === 'event') c.name = idx;
        else if(h === 'round') c.round = idx;
        else if(h.indexOf('opponent') !== -1) c.opponent = idx;
        else if(h.indexOf('venue') !== -1) c.venue = idx;
        else if(h.indexOf('date') !== -1) c.dt = idx;
      });
      return c;
    }
    var types = [], games = [], events = [], mode = 'types', gc = null, ec = null;
    function allocFor(cols, r, isEvent){
      var alloc = {};
      cols.allocs.forEach(function(a, k){
        var ti = -1;
        for(var t = 0; t < types.length; t++){
          var tn = norm(types[t].name);
          if(tn && a.head.indexOf(tn) !== -1){ ti = t; break; }
        }
        if(ti === -1 && isEvent) ti = 'event';
        else if(ti === -1 && k < types.length) ti = k;
        var n = parseFloat(String(r[a.idx] == null ? '' : r[a.idx]).replace(/[^0-9.\-]/g, ''));
        if(ti !== -1 && !isNaN(n)) alloc[ti] = n;
      });
      return alloc;
    }
    for(var i = 0; i < rows.length; i++){
      var r = rows[i];
      if(blank(r)) continue;
      var l0 = clean(r[0]).toLowerCase();
      if(i === 0 && l0.indexOf('sponsor name') === 0) continue;
      if(l0 === 'round'){ mode = 'games'; gc = mapCols(r); continue; }
      if(l0.indexOf('corporate event') === 0){ mode = 'events'; ec = mapCols(r); continue; }
      if(mode === 'types'){
        var tot = parseFloat(String(r[1] == null ? '' : r[1]).replace(/[^0-9.\-]/g, ''));
        if(clean(r[0]) && !isNaN(tot)) types.push({ name: clean(r[0]), total: tot });
        else if(clean(r[0]) && String(r[1] == null ? '' : r[1]).trim() === '' && i > 0 && /ticket|lounge|hospitality|box|suite/i.test(clean(r[0]))) types.push({ name: clean(r[0]), total: null });
      } else if(mode === 'games'){
        if(!clean(r[gc.opponent]) && !clean(r[gc.round])) continue;
        var dt = parseLooseDate(gc.dt != null ? r[gc.dt] : '', defYear);
        games.push({
          round: clean(r[gc.round]), opponent: clean(r[gc.opponent]), venue: clean(r[gc.venue]),
          date: dt.date, time: dt.time,
          rsvp: gc.rsvp != null ? parseLooseDate(r[gc.rsvp], defYear).date : '',
          notes: gc.notes != null ? clean(r[gc.notes]) : '',
          alloc: allocFor(gc, r)
        });
      } else if(mode === 'events'){
        var nameIdx = ec.name != null ? ec.name : 0;
        if(!clean(r[nameIdx])) continue;
        var edt = parseLooseDate(ec.dt != null ? r[ec.dt] : '', defYear);
        events.push({
          name: clean(r[nameIdx]), venue: clean(r[ec.venue]),
          date: edt.date, time: edt.time,
          rsvp: ec.rsvp != null ? parseLooseDate(r[ec.rsvp], defYear).date : '',
          notes: ec.notes != null ? clean(r[ec.notes]) : '',
          alloc: allocFor(ec, r, true)
        });
      }
    }
    return { types: types, games: games, events: events };
  }

  function applyHospImport(sponsor, ph){
    var hs = hospEnsure(sponsor);
    hs.types = ph.types.map(function(t){ return { id: uid(), name: t.name, total: t.total }; });
    hs.rows = {};
    function eventTypeId(){
      var found = hs.types.filter(function(t){ return t.name.toLowerCase() === 'event tickets'; })[0];
      if(!found){ found = { id: uid(), name: 'Event tickets', total: null }; hs.types.push(found); }
      return found.id;
    }
    function allocMap(a){
      var out = {};
      Object.keys(a || {}).forEach(function(k){
        if(k === 'event') out[eventTypeId()] = a[k];
        else if(hs.types[+k]) out[hs.types[+k].id] = a[k];
      });
      return out;
    }
    ph.games.forEach(function(g){
      var key = (g.round + '|' + g.opponent).toLowerCase();
      var fx = fixtures.games.filter(function(x){ return ((x.round || '') + '|' + (x.opponent || '')).toLowerCase() === key; })[0];
      if(!fx){
        fx = { id: uid(), round: g.round, opponent: g.opponent, venue: g.venue, date: g.date, time: g.time };
        fixtures.games.push(fx);
      } else {
        if(!fx.venue && g.venue) fx.venue = g.venue;
        if(!fx.date && g.date){ fx.date = g.date; fx.time = g.time; }
      }
      hs.rows[fx.id] = { alloc: allocMap(g.alloc), rsvp: g.rsvp || '', notes: g.notes || '' };
    });
    ph.events.forEach(function(e){
      var fx = fixtures.events.filter(function(x){ return (x.name || '').toLowerCase() === e.name.toLowerCase(); })[0];
      if(!fx){
        fx = { id: uid(), name: e.name, venue: e.venue, date: e.date, time: e.time };
        fixtures.events.push(fx);
      } else {
        if(!fx.venue && e.venue) fx.venue = e.venue;
        if(!fx.date && e.date){ fx.date = e.date; fx.time = e.time; }
      }
      hs.rows[fx.id] = { alloc: allocMap(e.alloc), rsvp: e.rsvp || '', notes: e.notes || '' };
    });
  }

  function allocHeader(t){ return /tickets\s*$/i.test(t.name) ? t.name + ' Allocated' : t.name + ' Tickets Allocated'; }
  function hasCap(t){ return t.total !== null && t.total !== undefined && t.total !== ''; }

  function buildHospSheetRows(sponsor){
    var hs = hospFor(sponsor);
    var types = hs.types || [];
    var rowsMap = hs.rows || {};
    var out = [['Sponsor Name', sponsor, 'Remaining']];
    types.forEach(function(t){ out.push(hasCap(t) ? [t.name, t.total, (+t.total || 0) - allocatedFor(sponsor, t.id)] : [t.name, '', '']); });
    out.push([]);
    out.push(['Round', 'Opponent', 'Venue', 'Date/Time', 'Due Date on RSVPs'].concat(types.map(allocHeader), ['Notes']));
    sortFixtures(fixtures.games).filter(function(g){ return rowsMap[g.id]; }).forEach(function(g){
      var r = rowsMap[g.id];
      out.push([g.round || '', g.opponent || '', g.venue || '', fmtDateTime(g.date, g.time, true), r.rsvp || ''].concat(
        types.map(function(t){ var v = r.alloc ? r.alloc[t.id] : ''; return (v === undefined || v === null) ? '' : v; }), [r.notes || '']));
    });
    out.push([]);
    out.push(['Corporate Event', 'Date/Time', 'Venue'].concat(types.map(allocHeader), ['Due Date on RSVPs', 'Notes']));
    sortFixtures(fixtures.events).filter(function(e){ return rowsMap[e.id]; }).forEach(function(e){
      var r = rowsMap[e.id];
      out.push([e.name || '', fmtDateTime(e.date, e.time, true), e.venue || ''].concat(
        types.map(function(t){ var v = r.alloc ? r.alloc[t.id] : ''; return (v === undefined || v === null) ? '' : v; }), [r.rsvp || '', r.notes || '']));
    });
    return out;
  }

  function exportXlsx(sponsor){
    if(typeof XLSX === 'undefined'){ alert('The Excel writer did not load. Check your connection and refresh the page.'); return; }
    var hasWip = wipItemsFor(sponsor).length > 0;
    var hasHosp = hospHasData(sponsor);
    if(!hasWip && !hasHosp){ alert('There is nothing to export yet.'); return; }
    var wb = XLSX.utils.book_new();
    if(hasWip){
      var ws = XLSX.utils.aoa_to_sheet(buildWipSheetRows(sponsor));
      ws['!cols'] = [{wch:26},{wch:52},{wch:12},{wch:16},{wch:60},{wch:14},{wch:40},{wch:12}];
      XLSX.utils.book_append_sheet(wb, ws, 'Sponsorship Overview');
    }
    if(hasHosp){
      var ws2 = XLSX.utils.aoa_to_sheet(buildHospSheetRows(sponsor));
      ws2['!cols'] = [{wch:32},{wch:20},{wch:24},{wch:30},{wch:18},{wch:22},{wch:22},{wch:30}];
      XLSX.utils.book_append_sheet(wb, ws2, 'Hospitality & Ticketing');
    }
    var fname = sponsor.replace(/[^A-Za-z0-9]+/g, '_') + '_x_Rabbitohs_' + new Date().getFullYear() + '_WIP.xlsx';
    XLSX.writeFile(wb, fname);
  }

  function importXlsx(file, sponsor){
    if(typeof XLSX === 'undefined'){ alert('The Excel reader did not load. Check your connection and refresh the page.'); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        var ovName = wb.SheetNames.filter(function(n){ return /overview/i.test(n); })[0] || wb.SheetNames[0];
        var parsed = null;
        if(!/hospitality|ticketing/i.test(ovName)){
          parsed = parseWipRows(XLSX.utils.sheet_to_json(wb.Sheets[ovName], { header: 1, defval: '' }));
          if(parsed && parsed.items.length === 0) parsed = null;
        }
        var hospName = wb.SheetNames.filter(function(n){ return /hospitality|ticketing/i.test(n); })[0];
        var parsedH = null;
        if(hospName){
          parsedH = parseHospRows(XLSX.utils.sheet_to_json(wb.Sheets[hospName], { header: 1, defval: '' }), defaultSeasonYear());
          if(parsedH.types.length === 0 && parsedH.games.length === 0 && parsedH.events.length === 0) parsedH = null;
        }
        if(!parsed && !parsedH){
          alert('Could not find a deliverables table or a hospitality sheet in that file.');
          return;
        }
        var found = [];
        if(parsed) found.push(parsed.items.length + ' deliverables');
        if(parsedH) found.push(parsedH.types.length + ' ticket types, ' + parsedH.games.length + ' games and ' + parsedH.events.length + ' events');
        var replacing = [];
        if(parsed && wipItemsFor(sponsor).length) replacing.push('deliverables');
        if(parsedH && hospHasData(sponsor)) replacing.push('hospitality and ticketing');
        var msg = 'Found ' + found.join(' and ') + ' in this file.' +
          (replacing.length ? '\n\nThis will replace the current ' + replacing.join(' and ') + ' for ' + sponsor + '.' : '') +
          '\n\nContinue?';
        if(!confirm(msg)) return;
        if(parsed){
          var target = wipEnsure(sponsor);
          target.items = parsed.items;
          ['designation', 'contacts', 'objectives'].forEach(function(k){
            if(parsed.info[k]) target.info[k] = parsed.info[k];
          });
          var pinfo = infoEnsure(sponsor);
          if(parsed.info.contacts && pinfo.contacts.length === 0){
            parsed.info.contacts.split(/\s*(?:,|;|\band\b|&)\s*/i).filter(Boolean).forEach(function(nm){
              pinfo.contacts.push({ id: uid(), name: nm, role: '', email: '', phone: '' });
            });
            savePartnerInfo();
          }
        }
        if(parsedH) applyHospImport(sponsor, parsedH);
        wipFilter = 'all';
        saveWip(); saveFixtures(); saveHosp(); render();
      } catch(err){
        alert('Sorry, that file could not be read: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function wireXlsx(sponsor){
    var ex = document.getElementById('wipExportBtn');
    if(ex) ex.onclick = function(){ exportXlsx(sponsor); };
    var im = document.getElementById('wipImportBtn');
    var fi = document.getElementById('wipFile');
    if(im && fi){
      im.onclick = function(){ fi.click(); };
      fi.onchange = function(e){
        var f = e.target.files && e.target.files[0];
        if(f) importXlsx(f, sponsor);
      };
    }
  }

  function renderFixtures(){
    var host = document.getElementById('content');
    var games = sortFixtures(fixtures.games);
    var events = sortFixtures(fixtures.events);
    function usedBy(fid){
      var n = 0;
      Object.keys(hosp).forEach(function(sp){ if(hosp[sp] && hosp[sp].rows && hosp[sp].rows[fid]) n++; });
      return n;
    }
    function usedText(fid){ var n = usedBy(fid); return n === 0 ? 'Not used yet' : n + (n === 1 ? ' partner' : ' partners'); }

    var gameRows = games.map(function(g){
      return '<div class="fx-grid fx-games" data-fxrow="' + g.id + '">' +
        '<input data-fk="game" data-fid="' + g.id + '" data-ff="round" value="' + escAttr(g.round || '') + '">' +
        '<input data-fk="game" data-fid="' + g.id + '" data-ff="opponent" value="' + escAttr(g.opponent || '') + '">' +
        '<input data-fk="game" data-fid="' + g.id + '" data-ff="venue" value="' + escAttr(g.venue || '') + '">' +
        '<input type="date" data-fk="game" data-fid="' + g.id + '" data-ff="date" value="' + escAttr(g.date || '') + '">' +

        '<span class="fx-used">' + usedText(g.id) + '</span>' +
        '<button class="wip-del" data-fdel="' + g.id + '" data-fk="game" aria-label="Remove game">&#10005;</button>' +

    }).join('');
    var eventRows = events.map(function(e){
      return '<div class="fx-grid fx-events" data-fxrow="' + e.id + '">' +
        '<input data-fk="event" data-fid="' + e.id + '" data-ff="name" value="' + escAttr(e.name || '') + '">' +
        '<input data-fk="event" data-fid="' + e.id + '" data-ff="venue" value="' + escAttr(e.venue || '') + '">' +
        '<input type="date" data-fk="event" data-fid="' + e.id + '" data-ff="date" value="' + escAttr(e.date || '') + '">' +
        '<input type="time" data-fk="event" data-fid="' + e.id + '" data-ff="time" value="' + escAttr(e.time || '') + '">' +
        '<span class="fx-used">' + usedText(e.id) + '</span>' +
        '<button class="wip-del" data-fdel="' + e.id + '" data-fk="event" aria-label="Remove event">&#10005;</button>' +
      '</div>';
    }).join('');

    host.innerHTML =
      '<div class="cat-head"><h2 class="section-title" style="color:var(--myrtle);margin:0;">Fixtures</h2></div>' +
      '<p class="cat-hint">Enter the club\'s games and corporate events once here. Then open a partner\'s Hospitality tab to choose which ones apply and allocate their tickets.</p>' +

      '<div class="fx-section"><h3 class="fx-h">Games</h3>' +
        '<div class="fx-addrow">' +
          '<input id="fxRound" placeholder="Round" style="width:80px;">' +
          '<input id="fxOpp" placeholder="Opponent" style="width:150px;">' +
          '<input id="fxVenue" placeholder="Venue" style="width:180px;">' +
          '<input type="date" id="fxDate">' +
          '<input type="time" id="fxTime">' +
          '<button id="fxAddGame">Add game</button>' +
        '</div>' +
        '<details class="fx-paste"><summary>Paste the draw from Excel</summary>' +
          '<textarea id="fxPaste" placeholder="Copy rows from Excel with the columns Round, Opponent, Venue, Date/Time and paste them here. One game per row."></textarea>' +
          '<button class="ghost-btn" id="fxPasteBtn">Add games from paste</button>' +
        '</details>' +
        (games.length === 0 ? '<p class="empty-list">No games yet. Add them above once the draw is out.</p>' :
          '<div class="fx-scroll"><div class="fx-table">' +
            '<div class="fx-grid fx-games head"><span>Round</span><span>Opponent</span><span>Venue</span><span>Date</span><span>Time</span><span>Used by</span><span></span></div>' +
            gameRows + '</div></div>') +
      '</div>' +

      '<div class="fx-section"><h3 class="fx-h">Corporate events</h3>' +
        '<div class="fx-addrow">' +
          '<input id="evName" placeholder="Event name" style="width:220px;">' +
          '<input id="evVenue" placeholder="Venue" style="width:180px;">' +
          '<input type="date" id="evDate">' +
          '<input type="time" id="evTime">' +
          '<button id="evAdd">Add event</button>' +
        '</div>' +
        (events.length === 0 ? '<p class="empty-list">No events yet.</p>' :
          '<div class="fx-scroll"><div class="fx-table">' +
            '<div class="fx-grid fx-events head"><span>Event</span><span>Venue</span><span>Date</span><span>Time</span><span>Used by</span><span></span></div>' +
            eventRows + '</div></div>') +
      '</div>';

    document.getElementById('fxAddGame').onclick = function(){
      var opp = document.getElementById('fxOpp').value.trim();
      var round = document.getElementById('fxRound').value.trim();
      if(!opp && !round){ document.getElementById('fxOpp').focus(); return; }
      fixtures.games.push({
        id: uid(), round: round, opponent: opp, venue: document.getElementById('fxVenue').value.trim(),
        date: document.getElementById('fxDate').value, time: document.getElementById('fxTime').value
      });
      saveFixtures(); render();
    };
    document.getElementById('evAdd').onclick = function(){
      var name = document.getElementById('evName').value.trim();
      if(!name){ document.getElementById('evName').focus(); return; }
      fixtures.events.push({
        id: uid(), name: name, venue: document.getElementById('evVenue').value.trim(),
        date: document.getElementById('evDate').value, time: document.getElementById('evTime').value
      });
      saveFixtures(); render();
    };
    document.getElementById('fxPasteBtn').onclick = function(){
      var text = document.getElementById('fxPaste').value;
      var added = 0;
      text.split(/\r?\n/).forEach(function(line){
        if(!line.trim()) return;
        var cells = line.indexOf('\t') !== -1 ? line.split('\t') : line.split(';');
        var c0 = (cells[0] || '').trim();
        if(c0.toLowerCase() === 'round') return;
        var opp = (cells[1] || '').trim();
        if(!opp && !c0) return;
        var dt = parseLooseDate((cells[3] || '').trim(), defaultSeasonYear());
        var key = (c0 + '|' + opp).toLowerCase();
        var exists = fixtures.games.some(function(x){ return ((x.round || '') + '|' + (x.opponent || '')).toLowerCase() === key; });
        if(exists) return;
        fixtures.games.push({ id: uid(), round: c0, opponent: opp, venue: (cells[2] || '').trim(), date: dt.date, time: dt.time });
        added++;
      });
      if(added === 0){ alert('No new games found. Each row needs at least a round or an opponent, separated by tabs (copying from Excel does this for you).'); return; }
      saveFixtures(); render();
    };
    host.querySelectorAll('[data-ff]').forEach(function(el){
      el.onchange = function(){
        var list = el.getAttribute('data-fk') === 'game' ? fixtures.games : fixtures.events;
        var f = list.filter(function(x){ return x.id === el.getAttribute('data-fid'); })[0];
        if(!f) return;
        f[el.getAttribute('data-ff')] = el.value;
        saveFixtures();
        var field = el.getAttribute('data-ff');
        if(field === 'date' || field === 'time') render();

    });
    host.querySelectorAll('[data-fdel]').forEach(function(el){
